set -g mouse on
set -g history-limit 10000

# Truecolor support
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"

# set index to 1
set -g base-index 1
set -g pane-base-index 1

# Remap prefix to Ctrl-a (like GNU screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Splits
bind | split-window -h
bind - split-window -v

# Reload conf
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Status bar (moderna)
set -g status on
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left side
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold]   #S #[bg=#1e1e2e,fg=#89b4fa]"

# Right side
set -g status-right-length 120
set -g status-right "#[fg=#f38ba8]#[bg=#f38ba8,fg=#1e1e2e]   %H:%M #[fg=#a6e3a1]#[bg=#a6e3a1,fg=#1e1e2e] #H "

# Window tabs
setw -g window-status-format "#[fg=#45475a] #I:#W "
setw -g window-status-current-format "#[bg=#89b4fa,fg=#1e1e2e,bold] #I:#W "

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

run '~/.tmux/plugins/tpm/tpm'

